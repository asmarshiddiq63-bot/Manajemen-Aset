<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#14173a">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<title>RDM Inventory & Aset</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#eef1f8;--card:#fff;--tx:#161a33;--mu:#6b7194;--bd:#e3e7f3;--side:#14173a;--p:#6c4cff;--c:#00c2d1;--o:#ff8a3d;--r:#ff4d6d;--g:#18b87a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0f24;--card:#171a3b;--tx:#eef0ff;--mu:#9aa0c9;--bd:#262a55;--side:#090a1c}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px 'Plus Jakarta Sans',system-ui,sans-serif;display:flex;min-height:100vh}
aside{width:230px;background:var(--side);color:#fff;padding:22px 14px;position:sticky;top:0;height:100vh;flex-shrink:0;display:flex;flex-direction:column;gap:4px}
.logo{display:flex;gap:10px;align-items:center;padding:0 8px 18px;font-weight:800;line-height:1.1}
.logo i{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--p),var(--c));display:grid;place-items:center;font-style:normal}
.logo small{display:block;font-weight:500;opacity:.6;font-size:11px}
nav button{all:unset;cursor:pointer;display:flex;gap:10px;align-items:center;padding:11px 12px;border-radius:11px;color:#b9bdea;width:calc(100% - 24px);font-weight:500}
nav button:hover{background:#ffffff14}nav button.on{background:linear-gradient(90deg,var(--p),#8b6dff);color:#fff;font-weight:700}
nav button:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--c);outline-offset:2px}
main{flex:1;padding:26px 30px;min-width:0}
h1{margin:0 0 4px;font-size:26px;font-weight:800}.sub{color:var(--mu);margin:0 0 20px}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}.bar .sp{flex:1}
.btn{border:0;cursor:pointer;background:var(--p);color:#fff;padding:10px 16px;border-radius:11px;font:700 13px inherit;font-family:inherit}
.btn.g{background:var(--card);color:var(--tx);border:1px solid var(--bd)}.btn.r{background:var(--r)}.btn.s{padding:6px 10px;font-size:12px}
.grid{display:grid;gap:16px}.k4{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}.k2{grid-template-columns:repeat(auto-fit,minmax(310px,1fr))}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:18px}
.hero{background:linear-gradient(120deg,#5b3df5,#00b7d4 85%);color:#fff;border:0;position:relative;overflow:hidden;grid-column:1/-1;display:flex;justify-content:space-between;flex-wrap:wrap;gap:16px;align-items:center}
.hero:after{content:"";position:absolute;right:-60px;top:-80px;width:260px;height:260px;border-radius:50%;background:#ffffff22}
.hero b{font-size:clamp(28px,5vw,46px);font-weight:800;display:block;letter-spacing:-1px}.hero span{opacity:.85}
.stat{display:flex;gap:12px;align-items:center}.stat i{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;font-style:normal;font-size:20px}
.stat b{font-size:24px;display:block;font-weight:800}.stat span{color:var(--mu);font-size:12px}
h3{margin:0 0 14px;font-size:15px}
table{width:100%;border-collapse:collapse}th{text-align:left;color:var(--mu);font-size:12px;font-weight:500;padding:8px 10px;border-bottom:1px solid var(--bd)}td{padding:11px 10px;border-bottom:1px solid var(--bd);vertical-align:middle}
.tw{overflow-x:auto}tr:last-child td{border:0}
.tag{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700}
.t-masuk,.t-ok{background:#18b87a22;color:var(--g)}.t-keluar{background:#ff8a3d22;color:var(--o)}.t-servis{background:#6c4cff22;color:var(--p)}.t-opname{background:#00c2d122;color:var(--c)}.t-low{background:#ff4d6d22;color:var(--r)}
label{display:block;font-size:12px;color:var(--mu);margin:0 0 4px;font-weight:700}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:12px}.fg>div.f{grid-column:1/-1}
.ov{position:fixed;inset:0;background:#0a0c24aa;display:grid;place-items:center;z-index:50;padding:14px;overflow:auto}
.md{background:var(--card);border-radius:20px;padding:22px;width:min(560px,100%);max-height:92vh;overflow:auto}
.md h2{margin:0 0 14px;font-size:18px;display:flex;justify-content:space-between}
.bars{display:flex;align-items:flex-end;gap:10px;height:150px}.bars>div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.bars .pair{display:flex;align-items:flex-end;gap:3px;height:120px;width:100%;justify-content:center}.bars .pair i{width:38%;border-radius:6px 6px 0 0;min-height:3px}
.hb{margin-bottom:11px}.hb div{display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px}.hb u{display:block;height:9px;border-radius:9px;text-decoration:none}
.tl{border-left:2px solid var(--bd);margin-left:6px;padding-left:16px}.tl>div{position:relative;margin-bottom:14px}.tl>div:before{content:"";position:absolute;left:-23px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--p)}
.qrg{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}.qrc{text-align:center}.qrc .q{display:grid;place-items:center;padding:10px;background:#fff;border-radius:12px;margin-bottom:8px;min-height:150px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#161a33;color:#fff;padding:11px 18px;border-radius:12px;z-index:99;font-weight:700}
.empty{text-align:center;color:var(--mu);padding:28px}
.mg{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}.mc{padding:0;overflow:hidden}.mb{padding:14px}
.ph{height:160px;background:linear-gradient(135deg,#6c4cff2a,#00c2d12a);display:grid;place-items:center;font-size:44px;position:relative}.ph img{width:100%;height:100%;object-fit:cover}.ph .tag{position:absolute;top:10px;left:10px;background:var(--card);color:var(--tx)}
.th{border-radius:9px;object-fit:cover;display:inline-grid;place-items:center;background:var(--bg);vertical-align:middle;flex-shrink:0}
#pv{width:100%;height:150px;border-radius:12px;background:var(--bg);display:grid;place-items:center;overflow:hidden;font-size:40px;border:1px dashed var(--bd)}#pv img{width:100%;height:100%;object-fit:cover}
#reader{width:100%;max-width:420px;margin:0 auto 12px;border-radius:14px;overflow:hidden}
@media(max-width:820px){body{flex-direction:column}aside{width:100%;height:auto;position:sticky;z-index:20;flex-direction:row;overflow-x:auto;padding:10px;top:0}.logo{display:none}nav{display:flex;gap:4px}nav button{white-space:nowrap;width:auto}main{padding:18px 14px}}
@media print{body *{visibility:hidden}#qrp,#qrp *{visibility:visible}#qrp{position:fixed;inset:0;background:#fff;color:#000;text-align:center;padding-top:40px}}
</style></head><body>
<aside><div class="logo"><i>▣</i><div>REVOLUTEK<small>Dananjaya Mandiri</small></div></div><nav id="nav"></nav></aside>
<main id="app"></main><div id="mount"></div>
<script>
const $=s=>document.querySelector(s),rp=n=>'Rp '+Math.round(+n||0).toLocaleString('id-ID'),today=()=>new Date().toISOString().slice(0,10),
esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),
fd=d=>d?new Date(d+'T00:00').toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'}):'-',
uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const KEY='rdm_inv_v2';let S;
function seed(){const d=(n)=>{const x=new Date();x.setDate(x.getDate()-n);return x.toISOString().slice(0,10)};
const it=[['Laptop Dell Latitude 5440','Elektronik','14 inch','unit',14500000,8,'Aset','Gudang A'],['Printer Epson L3250','Elektronik','A4','unit',2750000,5,'Aset','Gudang A'],['Kabel LAN Cat6','Jaringan','305 m','roll',1250000,12,'Barang','Rak B2'],['Switch TP-Link 24 Port','Jaringan','24 port','unit',2100000,3,'Aset','Rak B1'],['Kursi Ergonomis','Furnitur','Standar','unit',1850000,15,'Aset','Gudang C'],['Kertas HVS A4 80gr','ATK','A4','rim',52000,40,'Barang','Rak D1'],['Tinta Epson 003 Hitam','ATK','65 ml','botol',95000,4,'Barang','Rak D2'],['Mouse Wireless Logitech','Elektronik','M331','pcs',185000,20,'Barang','Rak A3']];
S={n:it.length,items:[],tx:[],sv:[],op:[]};
it.forEach((a,i)=>{const id=uid();S.items.push({id,code:'RDM-'+String(i+1).padStart(4,'0'),name:a[0],cat:a[1],size:a[2],unit:a[3],price:a[4],qty:a[5],kind:a[6],loc:a[7],min:5});
S.tx.push({id:uid(),item:id,type:'masuk',qty:a[5]+(i%3+2),date:d(40-i*3),party:'PT Sumber Teknik',note:'Pembelian awal',price:a[4]});
if(i%2==0)S.tx.push({id:uid(),item:id,type:'keluar',qty:i%3+2,date:d(12-i),party:'Divisi '+['IT','Finance','Operasional','HR'][i%4],note:'Permintaan unit kerja'})});
S.sv.push({id:uid(),item:S.items[0].id,issue:'Layar flicker',vendor:'Dell Service Center',cost:850000,start:d(5),est:new Date(Date.now()+4*864e5).toISOString().slice(0,10),status:'Proses'});
S.sv.push({id:uid(),item:S.items[3].id,issue:'Port 12 mati',vendor:'Teknisi Internal',cost:300000,start:d(20),est:d(16),status:'Selesai'});save()}
function load(){try{localStorage.removeItem('rdm_inv_v1')}catch(e){}try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){S=null}if(!S||!S.items)S={n:0,items:[],tx:[],sv:[],op:[]}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){try{toast('Penyimpanan penuh — gunakan foto lebih kecil atau hapus data lama')}catch(_){}}}
load();
const it=id=>S.items.find(x=>x.id==id),nm=id=>it(id)?it(id).name:'(dihapus)';
const toast=m=>{const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2200)};
function modal(title,body,onSave,label='Simpan'){const o=document.createElement('div');o.className='ov';o.innerHTML=`<div class="md"><h2>${title}<button class="btn g s" data-x>✕</button></h2>${body}${onSave?`<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px"><button class="btn g" data-x>Batal</button><button class="btn" data-ok>${label}</button></div>`:''}</div>`;
o.onclick=e=>{if(e.target==o||e.target.dataset.x!==undefined)o.remove()};
const ok=o.querySelector('[data-ok]');if(ok)ok.onclick=()=>{if(onSave(o)!==false)o.remove()};$('#mount').appendChild(o);return o}
const v=(o,n)=>o.querySelector('[name='+n+']').value;
const opts=(sel)=>S.items.map(i=>`<option value="${i.id}" ${i.id==sel?'selected':''}>${esc(i.code)} · ${esc(i.name)} (stok ${i.qty})</option>`).join('');
const pages={dash:'Dashboard',master:'Master Data',masuk:'Barang Masuk',keluar:'Barang Keluar',servis:'Servis',opname:'Stock Opname',qr:'Generate QR',scan:'Scan QR',stok:'Data Barang',export:'Ekspor Excel'};
const ico={dash:'◧',master:'🗂',masuk:'⬇',keluar:'⬆',servis:'🛠',opname:'☑',qr:'▦',scan:'⌖',stok:'☰',export:'📊'};
let page='dash',scanner=null;
function go(p){stopScan();page=p;try{history.replaceState(null,'','#'+p)}catch(e){}
$('#nav').innerHTML=Object.keys(pages).map(k=>`<button class="${k==p?'on':''}" onclick="go('${k}')"><span>${ico[k]}</span>${pages[k]}</button>`).join('');
$('#app').innerHTML='';R[p]();window.scrollTo(0,0)}
const head=(t,s,btn='')=>`<div class="bar"><div><h1>${t}</h1><p class="sub" style="margin:0">${s}</p></div><div class="sp"></div>${{master:1,stok:1,masuk:1,keluar:1,servis:1,opname:1}[page]?`<button class="btn g" onclick="exportX('${page=='stok'?'master':page}')">⬇ Excel</button>`:''}${btn}</div>`;
const R={};
/* DASHBOARD */
R.dash=()=>{const val=S.items.reduce((a,i)=>a+i.qty*i.price,0),tot=S.items.reduce((a,i)=>a+i.qty,0),low=S.items.filter(i=>i.qty<=i.min),act=S.sv.filter(s=>s.status=='Proses'),cost=S.sv.reduce((a,s)=>a+(+s.cost||0),0);
const cats={};S.items.forEach(i=>cats[i.cat]=(cats[i.cat]||0)+i.qty*i.price);const cl=['#6c4cff','#00c2d1','#ff8a3d','#ff4d6d','#18b87a','#f5c518'];
const ce=Object.entries(cats).sort((a,b)=>b[1]-a[1]);let off=0;
const donut=ce.map(([k,x],i)=>{const p=val?x/val*100:0,s=`<circle r="15.9155" cx="21" cy="21" fill="none" stroke="${cl[i%6]}" stroke-width="6" stroke-dasharray="${p} ${100-p}" stroke-dashoffset="${-off}"/>`;off+=p;return s}).join('');
const mo=[];for(let i=5;i>=0;i--){const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-i);const k=d.toISOString().slice(0,7);mo.push({l:d.toLocaleDateString('id-ID',{month:'short'}),m:S.tx.filter(t=>t.type=='masuk'&&t.date.startsWith(k)).reduce((a,t)=>a+ +t.qty,0),k:S.tx.filter(t=>t.type=='keluar'&&t.date.startsWith(k)).reduce((a,t)=>a+ +t.qty,0)})}
const mx=Math.max(1,...mo.map(m=>Math.max(m.m,m.k)));
const rec=hist().slice(0,6);
$('#app').innerHTML=head('Dashboard Aset','Ringkasan inventory & aset PT Revolutek Dananjaya Mandiri')+`<div class="grid k4">
<div class="card hero"><div><span>Total nilai inventory & aset</span><b>${rp(val)}</b><span>${S.items.length} jenis item · ${tot} unit tercatat</span></div><div style="position:relative;z-index:1;text-align:right"><span>Biaya servis kumulatif</span><b style="font-size:26px">${rp(cost)}</b></div></div>
${[['📦',tot,'Total unit','#6c4cff22'],['🏷',S.items.filter(i=>i.kind=='Aset').length,'Jenis aset','#00c2d122'],['⚠',low.length,'Stok menipis','#ff4d6d22'],['🛠',act.length,'Servis berjalan','#ff8a3d22']].map(s=>`<div class="card stat"><i style="background:${s[3]}">${s[0]}</i><div><b>${s[1]}</b><span>${s[2]}</span></div></div>`).join('')}</div>
<div class="grid k2" style="margin-top:16px"><div class="card"><h3>Nilai per kategori</h3><div style="display:flex;gap:18px;align-items:center;flex-wrap:wrap"><svg viewBox="0 0 42 42" width="150" height="150" style="transform:rotate(-90deg)"><circle r="15.9155" cx="21" cy="21" fill="none" stroke="var(--bd)" stroke-width="6"/>${donut}</svg><div style="flex:1;min-width:140px">${ce.map(([k,x],i)=>`<div class="hb"><div><span><b style="color:${cl[i%6]}">●</b> ${esc(k)}</span><span>${rp(x)}</span></div></div>`).join('')}</div></div></div>
<div class="card"><h3>Pergerakan barang 6 bulan (<b style="color:var(--g)">masuk</b> / <b style="color:var(--o)">keluar</b>)</h3><div class="bars">${mo.map(m=>`<div><div class="pair"><i style="height:${m.m/mx*100}%;background:var(--g)" title="Masuk ${m.m}"></i><i style="height:${m.k/mx*100}%;background:var(--o)" title="Keluar ${m.k}"></i></div><small>${m.l}</small></div>`).join('')}</div></div>
<div class="card"><h3>⚠ Perlu restock</h3>${low.length?low.map(i=>`<div class="hb"><div><span>${esc(i.name)}</span><b>${i.qty} / min ${i.min}</b></div><u style="width:${Math.min(100,i.qty/i.min*100)}%;background:var(--r)"></u></div>`).join(''):'<div class="empty">Semua stok aman 🎉</div>'}</div>
<div class="card"><h3>Aktivitas terbaru</h3>${rec.length?rec.map(h=>`<div style="display:flex;gap:10px;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--bd)"><span><span class="tag t-${h.type}">${h.type}</span> ${esc(nm(h.item))}</span><small style="color:var(--mu)">${fd(h.date)}</small></div>`).join(''):'<div class="empty">Belum ada aktivitas</div>'}</div></div>`};
function hist(id){const a=[];S.tx.forEach(t=>a.push({...t,t:'tx'}));S.sv.forEach(s=>a.push({...s,type:'servis',date:s.start,t:'sv'}));S.op.forEach(o=>a.push({...o,type:'opname',t:'op'}));return a.filter(h=>!id||h.item==id).sort((a,b)=>b.date.localeCompare(a.date)||0)}
/* MASTER DATA */
const th=(i,s)=>i.photo?`<img class="th" src="${i.photo}" alt="" style="width:${s}px;height:${s}px">`:`<span class="th" style="width:${s}px;height:${s}px">📦</span>`;
function readPhoto(f,cb){if(!f)return;if(!/^image\//.test(f.type)){toast('Pilih file gambar (JPG/PNG)');return}const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,480/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.72))};im.onerror=()=>toast('Gambar tidak bisa dibaca');im.src=r.result};r.onerror=()=>toast('Gagal membaca file');r.readAsDataURL(f)}
R.master=()=>{const q=(R.mq||'').toLowerCase(),k=R.mk||'';const L=S.items.filter(i=>(i.name+i.code+i.cat+i.loc).toLowerCase().includes(q)&&(!k||i.kind==k));
$('#app').innerHTML=head('Master Data','Data induk barang & aset lengkap dengan foto','<button class="btn" onclick="fMaster()">+ Tambah master</button>')+`<div class="bar"><input id="mq" placeholder="Cari nama, kode, kategori, lokasi…" value="${esc(R.mq||'')}" style="max-width:320px"><select id="mk" style="max-width:170px"><option value="">Semua jenis</option><option ${k=='Barang'?'selected':''}>Barang</option><option ${k=='Aset'?'selected':''}>Aset</option></select><span class="sub" style="margin:0">${L.length} item</span></div><div class="mg">${L.map(i=>`<div class="card mc"><div class="ph">${i.photo?`<img src="${i.photo}" alt="${esc(i.name)}">`:'📦'}<span class="tag ${i.kind=='Aset'?'t-servis':'t-opname'}">${i.kind}</span></div><div class="mb"><small style="color:var(--mu)">${i.code} · ${esc(i.cat)}</small><div style="font-weight:800;margin:2px 0 6px">${esc(i.name)}</div><div style="display:flex;justify-content:space-between;font-size:12px;color:var(--mu)"><span>Size: ${esc(i.size)}</span><span>${esc(i.loc)}</span></div><div style="display:flex;justify-content:space-between;align-items:center;margin:10px 0"><b>${rp(i.price)}</b><span class="tag ${i.qty<=i.min?'t-low':'t-ok'}">${i.qty} ${esc(i.unit)}</span></div><div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn g s" onclick="fMaster('${i.id}')">Edit</button><button class="btn g s" onclick="showHist('${i.id}')">Riwayat</button><button class="btn r s" onclick="delMaster('${i.id}')">Hapus</button></div></div></div>`).join('')||'<div class="empty card" style="grid-column:1/-1">Belum ada data. Klik “+ Tambah master”.</div>'}</div>`;
const rr=()=>{const p=$('#mq').selectionStart;R.master();const n=$('#mq');n.focus();n.setSelectionRange(p,p)};$('#mq').oninput=e=>{R.mq=e.target.value;rr()};$('#mk').onchange=e=>{R.mk=e.target.value;R.master()}};
function fMaster(id){const i=id?it(id):{name:'',cat:'',kind:'Barang',size:'',unit:'unit',price:'',loc:'',min:5,desc:'',photo:''};let ph=i.photo||'';
const o=modal(id?'Edit Master Data':'Tambah Master Data',`<div class="fg"><div class="f"><label>Foto barang / aset</label><div id="pv">${ph?`<img src="${ph}" alt="">`:'📦'}</div><div style="display:flex;gap:8px;margin-top:8px"><label class="btn g s" style="margin:0;cursor:pointer;color:var(--tx)">Pilih / ambil foto<input type="file" id="pf" accept="image/*" style="display:none"></label><button type="button" class="btn g s" id="pr">Hapus foto</button></div></div>
<div class="f"><label>Nama</label><input name="name" value="${esc(i.name)}"></div><div><label>Kategori</label><input name="cat" list="cats2" value="${esc(i.cat)}"><datalist id="cats2">${[...new Set(S.items.map(x=>x.cat))].map(c=>`<option>${esc(c)}`).join('')}</datalist></div><div><label>Jenis</label><select name="kind"><option ${i.kind=='Barang'?'selected':''}>Barang</option><option ${i.kind=='Aset'?'selected':''}>Aset</option></select></div>
<div><label>Size / ukuran</label><input name="size" value="${esc(i.size)}"></div><div><label>Satuan</label><input name="unit" value="${esc(i.unit)}"></div><div><label>Harga satuan (Rp)</label><input name="price" type="number" min="0" value="${i.price}"></div><div><label>Stok minimum</label><input name="min" type="number" min="0" value="${i.min}"></div><div><label>Lokasi simpan</label><input name="loc" value="${esc(i.loc)}"></div>${id?`<div><label>Stok saat ini</label><input value="${i.qty}" disabled></div>`:'<div><label>Stok awal</label><input name="qty" type="number" min="0" value="0"></div>'}<div class="f"><label>Keterangan</label><input name="desc" value="${esc(i.desc||'')}"></div></div>`,o=>{
const g=n=>v(o,n).trim(),p=+g('price');if(!g('name')){toast('Nama wajib diisi');return false}if(isNaN(p)||p<0){toast('Harga tidak valid');return false}
const d={name:g('name'),cat:g('cat')||'Umum',kind:g('kind'),size:g('size')||'-',unit:g('unit')||'unit',price:p,loc:g('loc')||'-',min:Math.max(0,+g('min')||0),desc:g('desc'),photo:ph};
if(id)Object.assign(i,d);else{const q=Math.max(0,Math.floor(+g('qty')||0));S.n++;const n={id:uid(),code:'RDM-'+String(S.n).padStart(4,'0'),qty:q,...d};S.items.push(n);if(q>0)S.tx.push({id:uid(),item:n.id,type:'masuk',qty:q,date:today(),party:'Stok awal',note:'Dari master data',price:p})}
save();toast('Master data tersimpan');go('master')});
o.querySelector('#pf').onchange=e=>readPhoto(e.target.files[0],u=>{ph=u;o.querySelector('#pv').innerHTML=`<img src="${u}" alt="">`;});o.querySelector('#pr').onclick=()=>{ph='';o.querySelector('#pv').innerHTML='📦';o.querySelector('#pf').value=''}}
function delMaster(id){const i=it(id);if(!confirm('Hapus "'+i.name+'" beserta seluruh riwayatnya (masuk, keluar, servis, opname)?'))return;S.items=S.items.filter(x=>x.id!=id);S.tx=S.tx.filter(x=>x.item!=id);S.sv=S.sv.filter(x=>x.item!=id);S.op=S.op.filter(x=>x.item!=id);save();toast('Master data dihapus');go('master')}
/* DATA BARANG */
R.stok=()=>{const q=(R.q||'').toLowerCase();const rows=S.items.filter(i=>(i.name+i.code+i.cat).toLowerCase().includes(q));
$('#app').innerHTML=head('Data Barang & Aset','Semua item tercatat. Klik baris untuk melihat riwayat.')+`<div class="bar"><input id="sq" placeholder="Cari nama, kode, kategori…" value="${esc(R.q||'')}" style="max-width:320px"></div><div class="card tw"><table><tr><th>Kode</th><th>Nama</th><th>Kategori</th><th>Size</th><th>Harga satuan</th><th>Stok</th><th>Lokasi</th><th></th></tr>${rows.map(i=>`<tr><td style="white-space:nowrap">${th(i,38)} <b>${i.code}</b></td><td>${esc(i.name)}<br><span class="tag ${i.kind=='Aset'?'t-servis':'t-opname'}">${i.kind}</span></td><td>${esc(i.cat)}</td><td>${esc(i.size)}</td><td>${rp(i.price)}</td><td><span class="tag ${i.qty<=i.min?'t-low':'t-ok'}">${i.qty} ${esc(i.unit)}</span></td><td>${esc(i.loc)}</td><td><button class="btn g s" onclick="showHist('${i.id}')">Riwayat</button></td></tr>`).join('')||'<tr><td colspan=8 class="empty">Tidak ada data</td></tr>'}</table></div>`;
const s=$('#sq');s.oninput=()=>{R.q=s.value;const p=s.selectionStart;R.stok();const n=$('#sq');n.focus();n.setSelectionRange(p,p)}};
/* MASUK */
R.masuk=()=>{const L=S.tx.filter(t=>t.type=='masuk').sort((a,b)=>b.date.localeCompare(a.date));
$('#app').innerHTML=head('Barang Masuk','Catat penerimaan barang & aset baru','<button class="btn" onclick="fMasuk()">+ Barang masuk</button>')+`<div class="card tw"><table><tr><th>Tanggal</th><th>Barang</th><th>Size</th><th>Qty</th><th>Harga satuan</th><th>Total</th><th>Supplier</th><th></th></tr>${L.map(t=>{const i=it(t.item)||{};return`<tr><td>${fd(t.date)}</td><td>${esc(i.name)}<br><small>${i.code||''}</small></td><td>${esc(i.size)}</td><td>${t.qty}</td><td>${rp(t.price)}</td><td><b>${rp(t.qty*t.price)}</b></td><td>${esc(t.party)}</td><td><button class="btn r s" onclick="delMasuk('${t.id}')">Hapus</button></td></tr>`}).join('')||'<tr><td colspan=8 class="empty">Belum ada barang masuk</td></tr>'}</table></div>`};
function fMasuk(){const o=modal('Barang Masuk',`<div class="fg"><div class="f"><label>Barang</label><select name="sel"><option value="">+ Barang / aset baru</option>${opts()}</select></div>
<div class="f"><label>Nama barang</label><input name="name"></div><div><label>Kategori</label><input name="cat" list="cats" value="Elektronik"><datalist id="cats">${[...new Set(S.items.map(i=>i.cat))].map(c=>`<option>${esc(c)}`).join('')}</datalist></div><div><label>Jenis</label><select name="kind"><option>Barang</option><option>Aset</option></select></div>
<div><label>Size / ukuran</label><input name="size" placeholder="mis. A4, 14 inch, XL"></div><div><label>Satuan</label><input name="unit" value="unit"></div>
<div><label>Harga satuan (Rp)</label><input name="price" type="number" min="0"></div><div><label>Jumlah masuk</label><input name="qty" type="number" min="1" value="1"></div>
<div><label>Supplier</label><input name="party"></div><div><label>Tanggal</label><input name="date" type="date" value="${today()}"></div><div><label>Lokasi simpan</label><input name="loc"></div><div><label>Stok minimum</label><input name="min" type="number" value="5"></div><div class="f"><label>Catatan</label><input name="note"></div></div>`,o=>{
const g=n=>v(o,n).trim(),q=+g('qty'),p=+g('price'),sel=g('sel');if(!(q>0)||p<0||isNaN(p)){toast('Isi jumlah & harga dengan benar');return false}
let i;if(sel){i=it(sel);i.price=p||i.price}else{if(!g('name')){toast('Nama barang wajib diisi');return false}S.n++;i={id:uid(),code:'RDM-'+String(S.n).padStart(4,'0'),name:g('name'),cat:g('cat')||'Umum',size:g('size')||'-',unit:g('unit')||'unit',price:p,qty:0,kind:g('kind'),loc:g('loc')||'-',min:+g('min')||0};S.items.push(i)}
i.qty+=q;S.tx.push({id:uid(),item:i.id,type:'masuk',qty:q,date:g('date')||today(),party:g('party')||'-',note:g('note'),price:p||i.price});save();toast('Barang masuk tersimpan');go('masuk')});
const s=o.querySelector('[name=sel]');s.onchange=()=>{const i=it(s.value),d=!!i;['name','cat','kind','size','unit','loc','min'].forEach(n=>o.querySelector('[name='+n+']').disabled=d);if(i){['name','cat','size','unit','loc','min','kind'].forEach(n=>o.querySelector('[name='+n+']').value=i[n]);o.querySelector('[name=price]').value=i.price}}}
function delMasuk(id){const t=S.tx.find(x=>x.id==id),i=it(t.item);if(i&&i.qty<t.qty){toast('Stok sudah terpakai, tidak bisa dihapus');return}if(!confirm('Hapus transaksi ini? Stok akan dikurangi.'))return;if(i)i.qty-=t.qty;S.tx=S.tx.filter(x=>x.id!=id);save();toast('Dihapus');go('masuk')}
/* KELUAR */
R.keluar=()=>{const L=S.tx.filter(t=>t.type=='keluar').sort((a,b)=>b.date.localeCompare(a.date));
$('#app').innerHTML=head('Barang Keluar','Distribusi barang & aset — bisa diedit atau dihapus','<button class="btn" onclick="fKeluar()">+ Barang keluar</button>')+`<div class="card tw"><table><tr><th>Tanggal</th><th>Barang</th><th>Qty</th><th>Tujuan / penerima</th><th>Catatan</th><th></th></tr>${L.map(t=>`<tr><td>${fd(t.date)}</td><td>${esc(nm(t.item))}</td><td><b>${t.qty}</b></td><td>${esc(t.party)}</td><td>${esc(t.note)}</td><td style="white-space:nowrap"><button class="btn g s" onclick="fKeluar('${t.id}')">Edit</button> <button class="btn r s" onclick="delKeluar('${t.id}')">Hapus</button></td></tr>`).join('')||'<tr><td colspan=6 class="empty">Belum ada barang keluar</td></tr>'}</table></div>`};
function fKeluar(id){const t=id?S.tx.find(x=>x.id==id):{item:'',qty:1,date:today(),party:'',note:''};
modal(id?'Edit Barang Keluar':'Barang Keluar',`<div class="fg"><div class="f"><label>Barang</label><select name="item" ${id?'disabled':''}>${opts(t.item)}</select></div><div><label>Jumlah</label><input name="qty" type="number" min="1" value="${t.qty}"></div><div><label>Tanggal</label><input name="date" type="date" value="${t.date}"></div><div class="f"><label>Tujuan / penerima</label><input name="party" value="${esc(t.party)}"></div><div class="f"><label>Catatan</label><input name="note" value="${esc(t.note)}"></div></div>`,o=>{
const i=it(id?t.item:v(o,'item')),q=+v(o,'qty');if(!i){toast('Pilih barang');return false}const avail=i.qty+(id?+t.qty:0);if(!(q>0)){toast('Jumlah tidak valid');return false}if(q>avail){toast('Stok tidak cukup (tersedia '+avail+')');return false}
if(id){i.qty+=+t.qty-q;Object.assign(t,{qty:q,date:v(o,'date'),party:v(o,'party'),note:v(o,'note')})}else{i.qty-=q;S.tx.push({id:uid(),item:i.id,type:'keluar',qty:q,date:v(o,'date')||today(),party:v(o,'party')||'-',note:v(o,'note')})}
save();toast('Tersimpan');go('keluar')})}
function delKeluar(id){if(!confirm('Hapus transaksi? Stok akan dikembalikan.'))return;const t=S.tx.find(x=>x.id==id),i=it(t.item);if(i)i.qty+=+t.qty;S.tx=S.tx.filter(x=>x.id!=id);save();toast('Dihapus');go('keluar')}
/* SERVIS */
R.servis=()=>{const L=[...S.sv].sort((a,b)=>b.start.localeCompare(a.start)),tc=L.reduce((a,s)=>a+(+s.cost||0),0);
$('#app').innerHTML=head('Servis Aset','Biaya & estimasi tanggal selesai servis','<button class="btn" onclick="fServis()">+ Servis baru</button>')+`<div class="grid k4" style="margin-bottom:16px"><div class="card stat"><i style="background:#ff8a3d22">🛠</i><div><b>${L.filter(s=>s.status=='Proses').length}</b><span>Sedang diservis</span></div></div><div class="card stat"><i style="background:#18b87a22">✔</i><div><b>${L.filter(s=>s.status=='Selesai').length}</b><span>Selesai</span></div></div><div class="card stat"><i style="background:#6c4cff22">💰</i><div><b style="font-size:19px">${rp(tc)}</b><span>Total biaya servis</span></div></div></div>
<div class="card tw"><table><tr><th>Aset</th><th>Kerusakan</th><th>Vendor</th><th>Biaya</th><th>Masuk</th><th>Estimasi selesai</th><th>Status</th><th></th></tr>${L.map(s=>{const late=s.status=='Proses'&&s.est<today();return`<tr><td>${esc(nm(s.item))}</td><td>${esc(s.issue)}</td><td>${esc(s.vendor)}</td><td>${rp(s.cost)}</td><td>${fd(s.start)}</td><td>${fd(s.est)}${late?' <span class="tag t-low">terlambat</span>':''}</td><td><span class="tag ${s.status=='Selesai'?'t-ok':s.status=='Batal'?'t-low':'t-servis'}">${s.status}</span></td><td style="white-space:nowrap"><button class="btn g s" onclick="fServis('${s.id}')">Edit</button> <button class="btn r s" onclick="delSv('${s.id}')">Hapus</button></td></tr>`}).join('')||'<tr><td colspan=8 class="empty">Belum ada data servis</td></tr>'}</table></div>`};
function fServis(id){const s=id?S.sv.find(x=>x.id==id):{item:'',issue:'',vendor:'',cost:'',start:today(),est:today(),status:'Proses'};
modal(id?'Edit Servis':'Form Servis',`<div class="fg"><div class="f"><label>Barang / aset</label><select name="item">${opts(s.item)}</select></div><div class="f"><label>Keluhan / kerusakan</label><input name="issue" value="${esc(s.issue)}"></div><div><label>Vendor / teknisi</label><input name="vendor" value="${esc(s.vendor)}"></div><div><label>Biaya servis (Rp)</label><input name="cost" type="number" min="0" value="${s.cost}"></div><div><label>Tanggal masuk servis</label><input name="start" type="date" value="${s.start}"></div><div><label>Estimasi tanggal selesai</label><input name="est" type="date" value="${s.est}"></div><div class="f"><label>Status</label><select name="status">${['Proses','Selesai','Batal'].map(x=>`<option ${x==s.status?'selected':''}>${x}</option>`).join('')}</select></div></div>`,o=>{
if(!S.items.length){toast('Tambahkan barang dulu');return false}if(!v(o,'issue').trim()){toast('Isi keluhan');return false}if(v(o,'est')<v(o,'start')){toast('Estimasi selesai tidak boleh sebelum tanggal masuk');return false}
const d={item:v(o,'item'),issue:v(o,'issue').trim(),vendor:v(o,'vendor')||'-',cost:+v(o,'cost')||0,start:v(o,'start'),est:v(o,'est'),status:v(o,'status')};id?Object.assign(s,d):S.sv.push({id:uid(),...d});save();toast('Servis tersimpan');go('servis')})}
function delSv(id){if(!confirm('Hapus data servis ini?'))return;S.sv=S.sv.filter(x=>x.id!=id);save();go('servis')}
/* OPNAME */
R.opname=()=>{const L=[...S.op].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,10);
$('#app').innerHTML=head('Stock Opname','Isi stok fisik hasil hitung, selisih otomatis terhitung','<button class="btn" id="so">Simpan hasil opname</button>')+`<div class="card tw"><table><tr><th>Kode</th><th>Barang</th><th>Stok sistem</th><th style="width:130px">Stok fisik</th><th>Selisih</th></tr>${S.items.map(i=>`<tr><td>${i.code}</td><td>${esc(i.name)}</td><td>${i.qty}</td><td><input type="number" min="0" data-id="${i.id}" placeholder="${i.qty}"></td><td data-d="${i.id}">-</td></tr>`).join('')}</table></div><div class="card tw" style="margin-top:16px"><h3>Riwayat opname terakhir</h3><table><tr><th>Tanggal</th><th>Barang</th><th>Sistem</th><th>Fisik</th><th>Selisih</th></tr>${L.map(o=>`<tr><td>${fd(o.date)}</td><td>${esc(nm(o.item))}</td><td>${o.sys}</td><td>${o.phys}</td><td><span class="tag ${o.phys-o.sys<0?'t-low':'t-ok'}">${o.phys-o.sys>0?'+':''}${o.phys-o.sys}</span></td></tr>`).join('')||'<tr><td colspan=5 class="empty">Belum ada opname</td></tr>'}</table></div>`;
document.querySelectorAll('[data-id]').forEach(e=>e.oninput=()=>{const i=it(e.dataset.id),c=$('[data-d="'+i.id+'"]');if(e.value==''){c.textContent='-';return}const d=+e.value-i.qty;c.innerHTML=`<span class="tag ${d<0?'t-low':d>0?'t-masuk':'t-ok'}">${d>0?'+':''}${d}</span>`});
$('#so').onclick=()=>{let n=0;document.querySelectorAll('[data-id]').forEach(e=>{if(e.value==='')return;const i=it(e.dataset.id),p=Math.max(0,Math.floor(+e.value));S.op.push({id:uid(),item:i.id,date:today(),sys:i.qty,phys:p,type:'opname'});i.qty=p;n++});if(!n){toast('Isi minimal satu stok fisik');return}save();toast(n+' item disesuaikan');go('opname')}};
/* QR */
function qrInto(el,txt,size){el.innerHTML='';try{new QRCode(el,{text:txt,width:size,height:size,correctLevel:QRCode.CorrectLevel.M})}catch(e){el.innerHTML='<b>'+esc(txt)+'</b>'}}
R.qr=()=>{$('#app').innerHTML=head('Generate QR Code','Tempel label QR pada barang; scan untuk melihat riwayatnya')+`<div class="qrg">${S.items.map(i=>`<div class="card qrc"><div class="q" id="q${i.id}"></div><b>${i.code}</b><div style="font-size:12px;color:var(--mu);margin:2px 0 8px">${esc(i.name)}</div><button class="btn s" onclick="bigQR('${i.id}')">Cetak / Unduh</button></div>`).join('')}</div>`;S.items.forEach(i=>qrInto($('#q'+i.id),i.code,128))};
function bigQR(id){const i=it(id),o=modal('Label QR',`<div id="qrp"><div id="qb" style="display:inline-grid;padding:14px;background:#fff;border-radius:12px"></div><h3 style="margin:10px 0 2px">${esc(i.name)}</h3><div>${i.code} · ${esc(i.size)}</div><small>PT Revolutek Dananjaya Mandiri</small></div><div style="display:flex;gap:8px;justify-content:center;margin-top:14px"><button class="btn" onclick="window.print()">Cetak</button><button class="btn g" id="dl">Unduh PNG</button></div>`);o.querySelector('#qrp').style.textAlign='center';qrInto(o.querySelector('#qb'),i.code,220);
o.querySelector('#dl').onclick=()=>{const c=o.querySelector('#qb canvas'),im=o.querySelector('#qb img'),u=c?c.toDataURL('image/png'):im&&im.src;if(!u){toast('QR belum siap');return}const a=document.createElement('a');a.href=u;a.download=i.code+'.png';a.click();toast('Mengunduh '+i.code+'.png')}}
/* EKSPOR EXCEL */
const cd=id=>it(id)||{},sd=a=>[...a].sort((x,y)=>(x.date||x.start||'').localeCompare(y.date||y.start||''));
const XD={
master:['Master Data',['Kode','Nama','Kategori','Jenis','Size','Satuan','Harga Satuan','Stok','Nilai Stok','Stok Minimum','Lokasi','Keterangan','Foto'],()=>S.items.map(i=>[i.code,i.name,i.cat,i.kind,i.size,i.unit,+i.price,i.qty,i.qty*i.price,i.min,i.loc,i.desc||'',i.photo?'Ada':'Tidak'])],
masuk:['Barang Masuk',['Tanggal','Kode','Nama Barang','Size','Jumlah','Satuan','Harga Satuan','Total','Supplier','Catatan'],()=>sd(S.tx.filter(t=>t.type=='masuk')).map(t=>[t.date,cd(t.item).code,cd(t.item).name,cd(t.item).size,+t.qty,cd(t.item).unit,+t.price,t.qty*t.price,t.party,t.note||''])],
keluar:['Barang Keluar',['Tanggal','Kode','Nama Barang','Jumlah','Satuan','Tujuan / Penerima','Catatan'],()=>sd(S.tx.filter(t=>t.type=='keluar')).map(t=>[t.date,cd(t.item).code,cd(t.item).name,+t.qty,cd(t.item).unit,t.party,t.note||''])],
servis:['Servis',['Kode','Nama Aset','Keluhan','Vendor','Biaya Servis','Tanggal Masuk','Estimasi Selesai','Status'],()=>sd(S.sv).map(s=>[cd(s.item).code,cd(s.item).name,s.issue,s.vendor,+s.cost,s.start,s.est,s.status])],
opname:['Stock Opname',['Tanggal','Kode','Nama Barang','Stok Sistem','Stok Fisik','Selisih'],()=>sd(S.op).map(o=>[o.date,cd(o.item).code,cd(o.item).name,o.sys,o.phys,o.phys-o.sys])]};
async function saveFile(o){let d=null;try{d=window.claude?await claude.use('downloads'):null}catch(e){}if(d)return d.save(o);const a=document.createElement('a'),u=URL.createObjectURL(new Blob([o.data]));a.href=u;a.download=o.filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000)}
function resetAll(){if(!confirm('Hapus SEMUA data (barang, transaksi, servis, opname, foto)? Tindakan ini tidak bisa dibatalkan.'))return;S={n:0,items:[],tx:[],sv:[],op:[]};save();toast('Semua data direset');go('dash')}
async function exportX(k){if(typeof XLSX=='undefined'){toast('Pustaka Excel gagal dimuat, muat ulang halaman');return}

try{const keys=k=='all'?Object.keys(XD):[k],wb=XLSX.utils.book_new();keys.forEach(x=>{const [n,h,f]=XD[x],r=f(),ws=XLSX.utils.aoa_to_sheet([h,...r]);ws['!cols']=h.map((c,j)=>({wch:Math.min(42,Math.max(c.length,...r.map(a=>String(a[j]??'').length))+2)}));XLSX.utils.book_append_sheet(wb,ws,n)});
const buf=XLSX.write(wb,{bookType:'xlsx',type:'array'});await saveFile({filename:(k=='all'?'RDM_Semua_Data':'RDM_'+XD[k][0].replace(/ /g,'_'))+'_'+today()+'.xlsx',data:buf});toast('File Excel siap disimpan')}catch(e){if(e&&e.code=='declined')return;toast('Gagal ekspor: '+((e&&(e.message||e.code))||'kesalahan tidak dikenal'))}}
R.export=()=>{$('#app').innerHTML=head('Ekspor ke Excel','Unduh per tabel (satu sheet), atau semua tabel sekaligus dalam satu file','<button class="btn" onclick="exportX(\'all\')">Unduh semua sheet (.xlsx)</button>')+`<div class="grid k2">${Object.keys(XD).map(k=>`<div class="card" style="display:flex;justify-content:space-between;align-items:center;gap:12px"><div><h3 style="margin:0 0 4px">${XD[k][0]}</h3><span class="sub" style="margin:0">${XD[k][2]().length} baris · ${XD[k][1].length} kolom</span></div><button class="btn g" onclick="exportX('${k}')">Unduh .xlsx</button></div>`).join('')}</div><p class="sub" style="margin-top:16px">File akan meminta konfirmasi simpan, lalu bisa dibuka di Microsoft Excel.</p><div class="card" style="margin-top:16px;border-color:var(--r)"><h3>Reset data</h3><p class="sub">Hapus semua barang, transaksi, servis, opname, dan foto di perangkat ini. Ekspor ke Excel dulu bila perlu arsip.</p><button class="btn r" onclick="resetAll()">Hapus semua data</button></div>`};
/* SCAN */
R.scan=()=>{$('#app').innerHTML=head('Scan QR Code','Scan lewat kamera, atau unggah gambar / foto QR')+`<div class="card" style="text-align:center"><div id="reader"></div><div class="bar" style="justify-content:center"><button class="btn" id="cam">Aktifkan kamera</button><button class="btn g" id="stop" style="display:none">Matikan kamera</button><label class="btn g" style="margin:0;cursor:pointer;color:var(--tx);font-size:13px">Unggah gambar QR<input type="file" id="sf" accept="image/*" style="display:none"></label></div><div id="rd2" style="display:none"></div><p class="sub" id="cm"></p><hr style="border:0;border-top:1px solid var(--bd);margin:14px 0"><label>Atau ketik kode barang manual</label><div style="display:flex;gap:8px;max-width:420px;margin:auto"><input id="mc" placeholder="mis. RDM-0001"><button class="btn" id="mg">Cari</button></div></div>`;
$('#sf').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;if(typeof Html5Qrcode=='undefined'){$('#cm').textContent='Pustaka scanner gagal dimuat. Gunakan input manual.';return}stopScan();$('#cam').style.display='';$('#stop').style.display='none';$('#cm').textContent='Membaca gambar…';try{const h=new Html5Qrcode('rd2');const t=await h.scanFile(f,false);try{h.clear()}catch(_){}$('#cm').textContent='';found(t)}catch(err){$('#cm').textContent='QR tidak terbaca. Pastikan gambar jelas, tidak buram, dan QR terlihat penuh.'}};
$('#mg').onclick=()=>found($('#mc').value);$('#mc').onkeydown=e=>{if(e.key=='Enter')found(e.target.value)};$('#stop').onclick=()=>{stopScan();$('#cam').style.display='';$('#stop').style.display='none'};
$('#cam').onclick=async()=>{if(typeof Html5Qrcode=='undefined'){$('#cm').textContent='Pustaka scanner gagal dimuat. Gunakan input manual.';return}
try{scanner=new Html5Qrcode('reader');await scanner.start({facingMode:'environment'},{fps:10,qrbox:220},txt=>{stopScan();found(txt)},()=>{});$('#cam').style.display='none';$('#stop').style.display='';$('#cm').textContent=''}catch(e){scanner=null;$('#cm').textContent='Kamera tidak bisa diakses (izinkan akses kamera di browser). Gunakan input manual.'}}};
function stopScan(){if(scanner){const s=scanner;scanner=null;s.stop().then(()=>s.clear()).catch(()=>{})}}
function found(code){code=String(code).trim().toUpperCase();const i=S.items.find(x=>x.code.toUpperCase()==code);if(!i){toast('Kode "'+code+'" tidak ditemukan');return}showHist(i.id);if(page=='scan')go('scan')}
function showHist(id){const i=it(id),h=hist(id);const ds={masuk:t=>`Masuk ${t.qty} ${i.unit} dari ${esc(t.party)} @ ${rp(t.price)}`,keluar:t=>`Keluar ${t.qty} ${i.unit} ke ${esc(t.party)}`,servis:s=>`${esc(s.issue)} — ${esc(s.vendor)} · biaya ${rp(s.cost)} · est. selesai ${fd(s.est)} (${s.status})`,opname:o=>`Opname: sistem ${o.sys} → fisik ${o.phys}`};
const o=modal('Riwayat Barang',`<div class="card" style="background:var(--bg);margin-bottom:14px">${i.photo?`<img src="${i.photo}" alt="" style="width:100%;max-height:200px;object-fit:cover;border-radius:12px;margin-bottom:10px">`:''}<b style="font-size:16px">${esc(i.name)}</b><br><small>${i.code} · ${esc(i.cat)} · ${esc(i.size)} · ${i.kind}</small><div style="display:flex;gap:18px;flex-wrap:wrap;margin-top:10px"><div><small>Stok</small><br><b>${i.qty} ${esc(i.unit)}</b></div><div><small>Harga satuan</small><br><b>${rp(i.price)}</b></div><div><small>Lokasi</small><br><b>${esc(i.loc)}</b></div></div></div><div class="tl">${h.map(x=>`<div><span class="tag t-${x.type}">${x.type}</span> <small style="color:var(--mu)">${fd(x.date)}</small><div style="margin-top:3px">${ds[x.type](x)}</div></div>`).join('')||'<div class="empty">Belum ada riwayat</div>'}</div>`)}
go(['dash','master','masuk','keluar','servis','opname','qr','scan','stok','export'].includes(location.hash.slice(1))?location.hash.slice(1):'dash');
</script><script>if('serviceWorker' in navigator&&location.protocol.startsWith('http'))addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));</script></body></html>
